# ==============================================================================
# Banco de dados
# ==============================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${APP_DB_USER}
quarkus.datasource.password=${APP_DB_PASSWORD}
quarkus.datasource.jdbc.url=${APP_DB_URL}
# ==============================================================================
# Hibernate ORM
# ==============================================================================
%dev.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
%prod.quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=true
# ==============================================================================
# Servidor HTTP e ambiente de desenvolvimento
# ==============================================================================
# A porta 8080 é utilizada pelo Keycloak.
quarkus.http.port=8081
# Os serviços de infraestrutura são fornecidos pelo Docker Compose do projeto.
quarkus.devservices.enabled=false
# ==============================================================================
# Autenticação OIDC com Keycloak
# ==============================================================================
quarkus.oidc.auth-server-url=http://localhost:8080/realms/kuasys-realm
quarkus.oidc.client-id=kuasys-client
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.oidc.application-type=service
# ==============================================================================
# Administração de usuários no Keycloak
# ==============================================================================
quarkus.keycloak.admin-client.server-url=http://localhost:8080
quarkus.keycloak.admin-client.realm=kuasys-realm
quarkus.keycloak.admin-client.client-id=kuasys-client
quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_CLIENT_SECRET}
quarkus.keycloak.admin-client.grant-type=client-credentials
#quarkus.smallrye-openapi.security-scheme=oauth2

